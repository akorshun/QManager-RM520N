# Fork-only CI for the UCS-2 SMS change: syntax/unit checks plus a full
# qmanager.tar.gz build (bun run build + build.sh), uploaded as an artifact
# for on-device testing. Not part of the upstream PR.
name: build package

on:
  push:
    branches: [ci/sms-ucs2-build]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install busybox (the modem's /bin/sh is BusyBox ash)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox

      - name: Shell syntax (dash + busybox ash)
        run: |
          for f in scripts/www/cgi-bin/quecmanager/cellular/sms.sh scripts/install_rm520n.sh; do
            sh -n "$f"
            busybox sh -n "$f"
            echo "ok: $f"
          done

      - name: Python helper compiles
        run: python3 -m py_compile scripts/usr/bin/qmanager_sms_send_ucs2

      - name: PDU builder unit test
        run: |
          python3 - <<'EOF'
          import importlib.machinery as mach, importlib.util as u
          l = mach.SourceFileLoader("h", "scripts/usr/bin/qmanager_sms_send_ucs2")
          s = u.spec_from_loader("h", l); m = u.module_from_spec(s); l.exec_module(m)
          smsc = "+79585370690"

          # Byte-for-byte the PDU an RM520N-GL accepted and delivered on air.
          pdus = m.build_pdus(smsc, "79778664876", "тест3")
          assert pdus == [("07919785350796F011000B919777684678F60008AA0A04420435044104420033", 24)], pdus

          # Short code -> national type of number.
          assert "0381" in m.build_pdus(smsc, "900", "баланс")[0][0][16:30]

          def decode(pdus):
              out, refs = [], set()
              for pdu, tp_len in pdus:
                  smsc_len = int(pdu[:2], 16)
                  tp = bytes.fromhex(pdu[2 + smsc_len * 2:])
                  assert len(tp) == tp_len
                  fo = tp[0]; da_digits = tp[2]; i = 4 + (da_digits + 1) // 2
                  assert tp[i:i + 2] == b"\x00\x08"          # PID, DCS=UCS-2
                  udl = tp[i + 3]; ud = tp[i + 4:]
                  assert len(ud) == udl <= 140
                  if fo & 0x40:                              # UDHI
                      assert ud[:3] == b"\x05\x00\x03"
                      refs.add(ud[3]); ud = ud[6:]
                  out.append(ud)
              assert len(refs) <= 1
              return b"".join(out).decode("utf-16-be")

          for text, parts in [("Ж" * 70, 1), ("Ж" * 71, 2), ("Привет! " * 20, 3),
                              ("а" * 66 + "😀" + "б" * 10, 2), ("ASCII + кириллица + 中文 🔥", 1)]:
              p = m.build_pdus(smsc, "79778664876", text)
              assert len(p) == parts, (text, len(p))
              assert decode(p) == text, text
          print("PDU builder: all checks passed")
          EOF

  package:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: discord-bot/go.mod
          cache-dependency-path: discord-bot/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: i18n parity
        run: bun run i18n:check

      - name: Next build
        run: bun run build

      - name: Package (icons check + build.sh)
        run: bun run package

      - name: Show package contents of interest
        run: |
          tar tzf qmanager-build/qmanager.tar.gz | grep -E "qmanager_sms_send_ucs2|cellular/sms.sh|install_rm520n.sh"
          cat qmanager-build/sha256sum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qmanager-${{ github.sha }}
          path: |
            qmanager-build/qmanager.tar.gz
            qmanager-build/sha256sum.txt
          if-no-files-found: error
